---
layout: default
---
<div class="post editorial-news-hub editorial-news-archive">
  <header class="editorial-news-hub__header"><p class="editorial-news-hub__kicker">新闻归档</p><h1>{{ page.date | date: "%Y" }} 年新闻</h1><p>共 {{ page.posts | size }} 条新闻</p></header>
  {% include news_filters.html %}
  <section class="editorial-news-list" aria-label="{{ page.date | date: '%Y' }} 年新闻">{% for post in page.posts %}{% include news_item.html post=post %}{% endfor %}</section>
  <a class="editorial-news-back" href="{{ '/blog/' | relative_url }}"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回全部新闻</a>
</div>
