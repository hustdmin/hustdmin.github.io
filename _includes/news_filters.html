{%- assign news_current_tag = include.current_tag | default: "" -%}
<nav class="editorial-filters" aria-label="新闻分类筛选">
  <span class="editorial-filters__label">分类</span>
  <div class="editorial-filters__list">
    <a class="editorial-filters__pill{% if include.context == 'all' %} is-active{% endif %}" href="{{ '/blog/' | relative_url }}" {% if include.context == 'all' %}aria-current="page"{% endif %}>全部</a>
    {% for tag in site.display_tags %}<a class="editorial-filters__pill{% if news_current_tag == tag %} is-active{% endif %}" href="{{ tag | slugify | prepend: '/blog/tag/' | append: '/' | relative_url }}" {% if news_current_tag == tag %}aria-current="page"{% endif %}>{{ tag }}</a>{% endfor %}
  </div>
</nav>
